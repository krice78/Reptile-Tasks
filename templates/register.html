<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | Critter Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% include "header.html" %}

    <div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
        
        {% if error %}
            <div class="card" style="border: 1px solid #f87171; background: rgba(248, 113, 113, 0.1); color: #f87171; margin-bottom: 20px; width: 100%; max-width: 400px; text-align: center;">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 style="margin-bottom: 10px;">Create Account</h1>
            <p class="subtle" style="margin-bottom: 30px;">Join the reptile community today</p>

            <form method="POST" action="{{ url_for('register') }}">
                <div style="text-align: left; margin-bottom: 15px;">
                    <label class="subtle">Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>

                <div style="text-align: left; margin-bottom: 20px;">
                    <label class="subtle">Password</label>
                    <input type="password" name="password" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>

            <div class="subtle" style="margin-top: 25px;">
                Already have an account?  
                <a href="{{ url_for('login') }}">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
