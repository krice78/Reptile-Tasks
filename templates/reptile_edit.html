<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit {{ reptile.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>

  <body>
    {% include "header.html" %}

    <div class="container">
      <div class="card">
        <a href="{{ url_for('reptile_view', reptile_id=reptile.id) }}" class="subtle">← Back to details</a>
        <h1 style="margin-top:10px;">Edit Reptile</h1>

        <form method="post" action="{{ url_for('edit_reptile_post', reptile_id=reptile.id) }}" class="form">
          <div class="row">
            <label>Name *</label>
            <input name="name" value="{{ reptile.name }}" required />
          </div>

          <div class="row">
            <label>Species *</label>
            <input name="species" value="{{ reptile.species }}" required />
          </div>

          <div class="row">
            <label>Image URL</label>
            <input name="image_url" value="{{ reptile.image_url or '' }}" />
          </div>

          <div class="row">
            <label>Appearance</label>
            <input name="appearance" value="{{ reptile.appearance or '' }}" />
          </div>

          <div class="row">
            <label>Diet</label>
            <input name="diet" value="{{ reptile.diet or '' }}" />
          </div>

          <div class="row">
            <label>Weight (grams)</label>
            <input name="weight_grams" type="number" step="0.1" value="{{ reptile.weight_grams or '' }}" />
          </div>

          <div class="row">
            <label>Feeding Frequency</label>
            {% set current_freq = reptile.feeding_schedule.frequency if reptile.feeding_schedule else '' %}

            <select id="feed_frequency" name="feed_frequency" class="pretty-select" required>
              <option value="" disabled {{ 'selected' if not current_freq else '' }}>Select frequency</option>

              <option value="daily" {{ 'selected' if current_freq == 'daily' else '' }}>Daily</option>
              <option value="every_other_day" {{ 'selected' if current_freq == 'every_other_day' else '' }}>Every other day</option>
              <option value="every_3_days" {{ 'selected' if current_freq == 'every_3_days' else '' }}>Every 3 days</option>
              <option value="weekly" {{ 'selected' if current_freq == 'weekly' else '' }}>Weekly</option>
              <option value="biweekly" {{ 'selected' if current_freq == 'biweekly' else '' }}>Every 2 weeks</option>
              <option value="monthly" {{ 'selected' if current_freq == 'monthly' else '' }}>Monthly</option>
            </select>

          </div>

          <div class="row">
            <label>Time of Day</label>
            <input name="feed_time" value="{{ reptile.feeding_schedule.time_of_day if reptile.feeding_schedule else '' }}" />
          </div>

          <div class="row">
            <label>Feeding Notes</label>
            <input name="feed_notes" value="{{ reptile.feeding_schedule.notes if reptile.feeding_schedule else '' }}" />
          </div>

          <div class="row">
            <label>Last Fed</label>
            <input type="date" name="last_fed">

          </div>

          <button type="submit">Save Changes</button>
        </form>
      </div>
    </div>
  </body>
</html>
