<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit {{ reptile.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>

  <body>
    <div class="container">
      <div class="card">
        <a href="{{ url_for('reptile_view', reptile_id=reptile.id) }}" class="subtle">← Back to details</a>
        <h1 style="margin-top:10px;">Edit Reptile</h1>

        <form method="post" action="{{ url_for('edit_reptile_post', reptile_id=reptile.id) }}" class="form">
          <div class="row">
            <label>Name *</label>
            <input name="name" value="{{ reptile.name }}" required />
          </div>

          <div class="row">
            <label>Species *</label>
            <input name="species" value="{{ reptile.species }}" required />
          </div>

          <div class="row">
            <label>Image URL</label>
            <input name="image_url" value="{{ reptile.image_url or '' }}" />
          </div>

          <div class="row">
            <label>Appearance</label>
            <input name="appearance" value="{{ reptile.appearance or '' }}" />
          </div>

          <div class="row">
            <label>Diet</label>
            <input name="diet" value="{{ reptile.diet or '' }}" />
          </div>

          <div class="row">
            <label>Weight (grams)</label>
            <input name="weight_grams" type="number" step="0.1" value="{{ reptile.weight_grams or '' }}" />
          </div>

          <div class="row">
            <label>Feeding Frequency</label>
            <input name="feed_frequency" value="{{ reptile.feeding_schedule.frequency if reptile.feeding_schedule else '' }}" />
          </div>

          <div class="row">
            <label>Time of Day</label>
            <input name="feed_time" value="{{ reptile.feeding_schedule.time_of_day if reptile.feeding_schedule else '' }}" />
          </div>

          <div class="row">
            <label>Feeding Notes</label>
            <input name="feed_notes" value="{{ reptile.feeding_schedule.notes if reptile.feeding_schedule else '' }}" />
          </div>

          <div class="row">
            <label>Last Fed (YYYY-MM-DD)</label>
            <input name="last_fed" value="{{ reptile.last_fed or '' }}" />
          </div>

          <button type="submit">Save Changes</button>
        </form>
      </div>
    </div>
  </body>
</html>
