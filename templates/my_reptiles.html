<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reptile Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
  </head>
  <body>
    {% include "header.html" %}

    <div class="container">
    <h1>My Reptiles</h1>

    <div class="reptile-grid">
        {% for reptile in reptiles %}
            <div class="card">
                <h3>{{ reptile.name }}</h3>
                <p>{{ reptile.species }}</p>
                <a href="{{ url_for('reptile_view', reptile_id=reptile.id) }}">View Details</a>
            </div>
        {% endfor %}
    </div>

    <hr>

<details class="add-reptile-dropdown">
    <summary class="dropdown-header">
        ➕ Add a New Reptile
    </summary>
    <div class="card" style="margin-top: 15px;">
        <form method="post" action="{{ url_for('my_reptiles_post') }}" class="inline-form">
            <input name="name" placeholder="Name" required />
            <input name="species" placeholder="Species" required />
            <button type="submit" class="btn">Save</button>
        </form>
    </div>
</details>
</div>
  </body>
</html>
